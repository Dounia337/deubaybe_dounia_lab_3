<!DOCTYPE html>
<html>
    
    <head>  
         <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alegreya">
         <link rel="stylesheet" href="../css/login.css">
         <title>
        
        Attendance tracker
    </title> 
</head>
    <body>
        
        <div class ="singin">  <p> <h4> <span > <a href="log-in.html"> Login </a></span>or <span> <a href="signup.html">Sign up </a></span> ? </h4></p></div>

     <form>

        <label for="email">Email Adress:</label>
        <input type="text" id="username" name="username" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <input type="submit" value="Log In">
     </form>
    </body>

    <script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function(event) {
        const email = document.getElementById("username");
        const password = document.getElementById("password");

        // Email must be valid format

        const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}$/;

        // Password must contain at least:
        // one uppercase, one lowercase, one digit, minimum 8 characters
        
        const passwordPattern = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/;

        if (!emailPattern.test(email.value)) {
        alert("Please enter a valid email address.");
        event.preventDefault();
        return;
        }

        if (!passwordPattern.test(password.value)) {
        alert("Password must contain one uppercase, one lowercase, one number, and be at least 8 characters long.");
        event.preventDefault();
        return;
        }
    });
    
    </script>
    
</html>
